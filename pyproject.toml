[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-versioner"
version = "0.1.0"
description = "Version Markdown lab protocols with change notes and line diffs between versions."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
protocol-versioner = "protocol_versioner.cli:main"

[tool.setuptools]
packages = ["protocol_versioner"]
